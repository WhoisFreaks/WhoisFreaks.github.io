openapi: 3.0.3
info:
  title: WhoisFreaks API
  description:
    "Complete WhoisFreaks API: WHOIS, DNS, SSL, Geolocation, Typosquatting,\nIP Intelligence,\
    \ Domain Reputation, and bulk database downloads.\n\n## Authentication\nAll requests require an `apiKey`\
    \ query parameter.\n\n## Resources\n- Docs: https://whoisfreaks.com/documentation\n- Billing: https://billing.whoisfreaks.com\n\
    - Support: support@whoisfreaks.com\n"
  version: 1.0.0
  contact:
    name: WhoisFreaks Support
    email: support@whoisfreaks.com
    url: https://whoisfreaks.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.whoisfreaks.com
    description: API Solutions (live lookups)
  - url: https://files.whoisfreaks.com
    description: Database file downloads
security:
  - ApiKeyAuth: []
tags:
  - name: WHOIS
    description: WHOIS lookup APIs (live, historical, reverse, bulk)
  - name: DNS
    description: DNS lookup APIs (live, historical, reverse, bulk)
  - name: Domain Availability
    description: Check domain availability
  - name: Typosquatting
    description: Detect typo variants of brand domains
  - name: SSL
    description: SSL certificate lookup
  - name: Geolocation
    description: IP geolocation lookup
  - name: Subdomains
    description: Subdomain enumeration
  - name: IP Reputation
    description: IP threat intelligence
  - name: Domain Reputation
    description: Real-time domain threat assessment and trust scoring
  - name: ASN WHOIS
    description: Autonomous System Number WHOIS
  - name: IP WHOIS
    description: IP address WHOIS
  - name: Account
    description: Account, API key, and usage utilities
  - name: Databases - Newly Registered
    description: Newly registered domain downloads
  - name: Databases - Expiring & Dropped
    description: Expiring and dropped domain downloads
  - name: Databases - WHOIS
    description: WHOIS database snapshots
  - name: Databases - DNS
    description: DNS database snapshots
  - name: Databases - Subdomains
    description: Subdomain database snapshots
  - name: Databases - IP Geolocation
    description: IP geolocation database snapshots
  - name: Databases - ASN WHOIS
    description: ASN WHOIS database snapshots
  - name: Databases - IP WHOIS
    description: IP WHOIS database snapshots
  - name: Databases - IP Security
    description: IP security database snapshots
  - name: Databases - Threat Feed
    description: Daily phishing, malware and spam threat feeds
paths:
  /v2.0/whois/live:
    get:
      tags:
        - WHOIS
      summary: Live WHOIS Lookup
      description: Real-time WHOIS lookup from authoritative servers. Cost 1 credit.
      operationId: whoisLive
      parameters:
        - name: domainName
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoisResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v2.0/bulkwhois/live:
    post:
      tags:
        - WHOIS
      summary: Bulk WHOIS Lookup
      description: Up to 100 domains in one request. 1 credit per successful domain.
      operationId: bulkWhois
      parameters:
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domainNames
              properties:
                domainNames:
                  type: array
                  items:
                    type: string
                  maxItems: 100
              example:
                domainNames:
                  - whoisfreaks.com
                  - jfreaks.com
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkWhoisResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.0/dns/live:
    get:
      tags:
        - DNS
      summary: Live DNS Lookup
      description: Real-time DNS record lookup. 1 credit per query.
      operationId: dnsLive
      parameters:
        - name: domainName
          in: query
          schema:
            type: string
          example: whoisfreaks.com
        - name: ipAddress
          in: query
          schema:
            type: string
          description: Use for PTR lookups
          example: 8.8.8.8
        - name: type
          in: query
          schema:
            type: string
            default: all
          required: true
          description: "all or comma-separated: A,MX,NS,TXT,SOA,SPF,AAAA,CNAME"
          example: "A,MX,TXT"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v2.0/dns/historical:
    get:
      tags:
        - DNS
      summary: Historical DNS Lookup
      description: All historical DNS records. 2 credits per page (100 records/page).
      operationId: dnsHistorical
      parameters:
        - name: domainName
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: type
          in: query
          schema:
            type: string
            default: all
          required: true
          example: "A,MX,TXT"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDnsResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.1/dns/reverse:
    get:
      tags:
        - DNS
      summary: Reverse DNS Lookup
      description: Search domains by IP or DNS value. 5 credits per page.
      operationId: dnsReverse
      parameters:
        - name: value
          in: query
          schema:
            type: string
          required: true
          description: IP, CIDR, or record value
          example: 8.8.8.8
        - name: type
          in: query
          schema:
            type: string
            enum:
              - a
              - mx
              - cname
              - ns
              - aaaa
              - txt
              - soa
          required: true
        - name: exact
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseDnsResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.0/dns/bulk/live:
    post:
      tags:
        - DNS
      summary: Bulk DNS Lookup
      description: Up to 100 domains + 100 IPs in one request.
      operationId: dnsBulk
      parameters:
        - name: type
          in: query
          schema:
            type: string
            default: all
          required: true
          example: "A,MX,TXT"
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domainNames:
                  type: array
                  items:
                    type: string
                ipAddresses:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDnsResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.0/domain/availability:
    get:
      tags:
        - Domain Availability
      summary: Domain Availability Check with Suggestions
      description:
        Check availability of a single domain and optionally get suggestions across multiple
        TLDs. 1 credit per domain checked. sug=false checks only the queried domain; sug=true returns
        up to `count` (max 100) TLD suggestions.
      operationId: domainAvailabilityV2
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain name to check
          example: google.com
        - name: sug
          in: query
          schema:
            type: boolean
            default: false
          description: Whether to return TLD suggestions alongside the queried domain.
        - name: count
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 100
          description: Number of TLD suggestions to return when sug=true. Maximum is 100.
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Domain Availability
      summary: Bulk Domain Availability Check
      description:
        "Two bulk modes. Mode 1: POST domainNames array. Mode 2: POST tld array plus domain
        query param. Max 100 domains per request. 1 credit per domain checked."
      operationId: bulkDomainAvailabilityV2
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Required for TLD-mode bulk check (base domain).
          example: google.com
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDomainAvailabilityRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDomainAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v3.0/domain/typos:
    get:
      tags:
        - Typosquatting
      summary: Typosquatting Lookup
      description: Find typo variants of a brand. 5 credits per page.
      operationId: typosquatting
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          example: whoisfreaks
        - name: pattern
          in: query
          schema:
            type: string
          example: "whois*"
        - name: pageToken
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1.0/ssl/live:
    get:
      tags:
        - SSL
      summary: SSL Certificate Lookup
      description: Real-time SSL cert with optional chain.
      operationId: sslLookup
      parameters:
        - name: domainName
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: chain
          in: query
          schema:
            type: boolean
            default: false
        - name: sslRaw
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SslResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1.0/geolocation:
    get:
      tags:
        - Geolocation
      summary: IP Geolocation Lookup
      description: Get location, ASN, currency for an IP. 1 credit.
      operationId: geolocation
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          example: 8.8.8.8
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeolocationResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - Geolocation
      summary: Bulk IP Geolocation
      description: Up to 100 IPs.
      operationId: bulkGeolocation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ips
              properties:
                ips:
                  type: array
                  items:
                    type: string
                  maxItems: 100
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeolocationResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1.0/subdomains:
    get:
      tags:
        - Subdomains
      summary: Subdomains Lookup
      description: All subdomains including nested. 2 credits per query.
      operationId: subdomains
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: after
          in: query
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: before
          in: query
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubdomainsResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1.0/security:
    get:
      tags:
        - IP Reputation
      summary: IP Reputation Lookup
      description: "Threat intel for IP: VPN, proxy, Tor, bots. 1 credit."
      operationId: ipReputation
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          example: 8.8.8.8
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpReputationResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - IP Reputation
      summary: Bulk IP Reputation
      description: Up to 100 IPs.
      operationId: bulkIpReputation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ips
              properties:
                ips:
                  type: array
                  items:
                    type: string
                  maxItems: 100
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IpReputationResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1/domain/security:
    get:
      tags:
        - Domain Reputation
      summary: Domain Reputation Lookup
      description:
        Real-time domain threat assessment. Returns risk verdict, trust score, DGA analysis,
        threat intelligence matches, and security signals. 1 credit.
      operationId: domainReputation
      parameters:
        - name: domainName
          in: query
          schema:
            type: string
          required: true
          description: The domain name to assess
          example: amazon.com
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainReputationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v2.0/asn-whois:
    get:
      tags:
        - ASN WHOIS
      summary: ASN WHOIS Lookup
      description: WHOIS for an ASN. 1 credit.
      operationId: asnWhois
      parameters:
        - name: asn
          in: query
          schema:
            type: string
          required: true
          example: as15169
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsnWhoisResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1.0/ip-whois:
    get:
      tags:
        - IP WHOIS
      summary: IP WHOIS Lookup
      description: WHOIS for an IP address. 1 credit.
      operationId: ipWhois
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          example: 8.8.8.8
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpWhoisResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v1.0/api-key/rotate:
    get:
      tags:
        - Account
      summary: Rotate API Key
      operationId: rotateApiKey
      parameters: []
      responses:
        "200":
          description: Key rotated
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Not allowed
          content:
            text/plain:
              schema:
                type: string
      description: Rotate API Key. Returns the file/snapshot described by this operation.
  /v1.0/whoisapi/usage:
    get:
      tags:
        - Account
      summary: Account Usage
      operationId: accountUsage
      parameters: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsageResponse"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Account Usage. Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/gtld:
    servers: &id001
      - url: https://files.whoisfreaks.com
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered gTLD (CSV)
      operationId: dbNewlyGtld
      parameters:
        - name: whois
          in: query
          schema:
            type: boolean
          required: true
          example: true
        - $ref: "#/components/parameters/DateParam"
        - name: tlds
          in: query
          schema:
            type: string
          example: "com,net"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Newly Registered gTLD (CSV). Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/cctld:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered ccTLD (CSV)
      operationId: dbNewlyCctld
      parameters:
        - name: whois
          in: query
          schema:
            type: boolean
          required: true
          example: true
        - $ref: "#/components/parameters/DateParam"
        - name: tlds
          in: query
          schema:
            type: string
          example: "com,net"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Newly Registered ccTLD (CSV). Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/gtld/cleaned:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered gTLD Cleaned WHOIS (CSV)
      operationId: dbNewlyGtldCleaned
      parameters:
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description:
        Newly Registered gTLD Cleaned WHOIS (CSV). Returns the file/snapshot described by this
        operation.
  /v3.1/download/domainer/cctld/cleaned:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered ccTLD Cleaned WHOIS (CSV)
      operationId: dbNewlyCctldCleaned
      parameters:
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description:
        Newly Registered ccTLD Cleaned WHOIS (CSV). Returns the file/snapshot described by
        this operation.
  /v3.1/domains/newly/gtld:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered gTLD (JSON)
      operationId: dbNewlyGtldJson
      parameters:
        - $ref: "#/components/parameters/DateParam"
        - name: tlds
          in: query
          schema:
            type: string
          example: "com,net"
      responses:
        "200":
          description: JSON array of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Newly Registered gTLD (JSON). Returns the file/snapshot described by this operation.
  /v3.1/domains/newly/cctld:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered ccTLD (JSON)
      operationId: dbNewlyCctldJson
      parameters:
        - $ref: "#/components/parameters/DateParam"
        - name: tlds
          in: query
          schema:
            type: string
          example: "com,net"
      responses:
        "200":
          description: JSON array of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Newly Registered ccTLD (JSON). Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/newly/dns:
    servers: *id001
    get:
      tags:
        - Databases - Newly Registered
      summary: Newly Registered With DNS
      operationId: dbNewlyDns
      parameters:
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: JSON array of domains with DNS
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Newly Registered With DNS. Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/expired:
    servers: *id001
    get:
      tags:
        - Databases - Expiring & Dropped
      summary: Expiring Domains
      operationId: dbExpired
      parameters:
        - name: whois
          in: query
          schema:
            type: boolean
          required: true
          example: true
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Expiring Domains. Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/expired/cleaned:
    servers: *id001
    get:
      tags:
        - Databases - Expiring & Dropped
      summary: Expiring Cleaned WHOIS
      operationId: dbExpiredCleaned
      parameters:
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: CSV
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/ErrorResponse"
      description: Expiring Cleaned WHOIS. Returns the file/snapshot described by this operation.
  /v3.1/download/domainer/dropped:
    servers: *id001
    get:
      tags:
        - Databases - Expiring & Dropped
      summary: Dropped Domains
      operationId: dbDropped
      parameters:
