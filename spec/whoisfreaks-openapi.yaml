  /v2.0/domain/availability:
    get:
      tags:
        - Domain Availability
      summary: Domain Availability Check with Suggestions
      description:
        Check availability of a single domain and optionally get suggestions across multiple
        TLDs. 1 credit per domain checked. sug=false checks only the queried domain; sug=true returns
        up to `count` (max 100) TLD suggestions.
      operationId: domainAvailabilityV2
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain name to check
          example: google.com
        - name: sug
          in: query
          schema:
            type: boolean
            default: false
          description: Whether to return TLD suggestions alongside the queried domain.
        - name: count
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 100
          description: Number of TLD suggestions to return when sug=true. Maximum is 100.
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Domain Availability
      summary: Bulk Domain Availability Check
      description:
        "Two bulk modes. Mode 1: POST domainNames array. Mode 2: POST tld array plus domain
        query param. Max 100 domains per request. 1 credit per domain checked."
      operationId: bulkDomainAvailabilityV2
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Required for TLD-mode bulk check (base domain).
          example: google.com
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDomainAvailabilityRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDomainAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v3.0/domain/typos:
    get:
      tags:
        - Typosquatting
      summary: Typosquatting Lookup
      description: Find typo variants of a brand. 5 credits per page.
      operationId: typosquatting
      parameters:
        - name: keyword
          description: "Brand or label to find typo variants for. Pass either keyword or pattern, not both."
          in: query
          schema:
            type: string
          example: whoisfreaks
        - name: pattern
          description: "Wildcard search string, where '*' matches any characters. Pass either keyword or pattern, not both."
          in: query
          schema:
            type: string
          example: "whois*"
        - name: pageToken
          description: "Token from nextPageToken in the previous response, needed from page 2 onward. Send it with the original keyword or pattern."
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingResponse"
              example:
                status: true
                totalRecords: 741
                currentPage: 1
                totalPages: 8
                hasNextPage: true
                nextPageToken: eyJkb21haW5OYW1lIjoidG9kZGxlLnJ1IiwiY3VycmVudFBhZ2UiOjF9
                domains:
                - domainName: t-doodle.co.za
                  createDate: '2024-02-27'
                  expiryDate: '2026-02-27'
                  lastSeen: '2025-12-27'
                  isDropped: false
                - domainName: t-doodle.com
                  createDate: '2023-10-27'
                  expiryDate: '2025-10-27'
                  lastSeen: '2025-07-03'
