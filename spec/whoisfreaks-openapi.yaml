  /v1.0/subdomains:
    get:
      tags:
        - Subdomains
      summary: Subdomains Lookup
      description: All subdomains including nested. 2 credits per query.
      operationId: subdomains
      parameters:
        - name: domain
          description: "Domain whose subdomains you want."
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: after
          description: "Only return records created after this date, in YYYY-MM-DD format. Defaults to the oldest record held, and must not be in the future or later than before."
          in: query
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: before
          description: "Only return records created before this date, in YYYY-MM-DD format. Defaults to today, and must not be in the future."
          in: query
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: status
          description: "Limit results to active or inactive subdomains. Both are returned when the parameter is left out."
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: page
          description: "Page of results to return. Defaults to 1."
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/Format"
      responses:
