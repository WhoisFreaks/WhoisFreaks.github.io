        - DNS
      summary: Reverse DNS Lookup
      description: Search domains by IP or DNS value. 5 credits per page.
      operationId: dnsReverse
      parameters:
        - name: value
          in: query
          schema:
            type: string
          required: true
          description: IP, CIDR, or record value
          example: 8.8.8.8
        - name: type
          description: "DNS record type to search by."
          in: query
          schema:
            type: string
            enum:
              - a
              - mx
              - cname
              - ns
              - aaaa
              - txt
              - soa
          required: true
        - name: exact
          description: "Set true to match value exactly. Defaults to false, where value is treated as a pattern and '*' matches any characters. Ignored for A and AAAA records, which always match the IP."
