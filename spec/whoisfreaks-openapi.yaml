      parameters:
        - name: domainName
          description: "Domain to look up."
          in: query
          schema:
            type: string
          example: whoisfreaks.com
        - name: ipAddress
          in: query
          schema:
            type: string
          description: Use for PTR lookups
          example: 8.8.8.8
        - name: type
          in: query
          schema:
            type: string
            default: all
          required: true
          description: "all or comma-separated: A,MX,NS,TXT,SOA,SPF,AAAA,CNAME"
          example: "A,MX,TXT"
        - $ref: "#/components/parameters/Format"
