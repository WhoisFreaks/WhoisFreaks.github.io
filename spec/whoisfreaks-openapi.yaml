          $ref: "#/components/responses/ErrorResponse"
  /v3.4/status:
    servers: *id001
    get:
      tags:
        - Account
      summary: Database File Status (Public)
      description: No API key required. Returns freshness of all downloadable files.
      operationId: databaseFileStatus
      security: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseFileStatus"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
  parameters:
    Format:
      name: format
      in: query
      description: "Response format. JSON when the parameter is left out."
      schema:
        type: string
        enum:
          - json
          - xml
        default: json
    DateParam:
      name: date
      in: query
      schema:
        type: string
        format: date
      description: yyyy-MM-dd; omit for latest
      example: "2026-10-01"
    StreamDateParam:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: yyyy-MM-dd. Streaming always requires a date, unlike the download endpoints.
      example: "2026-10-01"
    StreamOffset:
      name: offset
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Data rows to skip from the start of the file. The header row is never counted. Rows are skipped by reading forward, so a large offset costs more than a small one.
      example: 0
    StreamLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Maximum data rows to return. Omit for the whole file. limit=0 returns the header row on its own.
      example: 100
    StreamWhois:
      name: whois
      in: query
      schema:
        type: boolean
        default: false
      description: true streams the full WHOIS record per domain with a CSV header row; false streams only the domain names, one per line and with no header. The cleaned file types exist only in the WHOIS form, so pass true for those.
      example: true
    SortOrder:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
      description: Sort direction. Omit to leave the results unsorted.
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - firstSeen
          - lastSeen
        default: lastSeen
      description: Field to sort on. Only applies when sort is given.
    ReverseValue:
      name: value
      in: query
      schema:
        type: string
      required: true
      description: IP, CIDR, or record value
      example: 8.8.8.8
    ReverseType:
      name: type
      in: query
      description: "DNS record type to search by."
      schema:
        type: string
        enum:
          - a
          - mx
          - cname
          - ns
          - aaaa
          - txt
          - soa
      required: true
    ReverseExact:
      name: exact
      in: query
      schema:
        type: boolean
        default: true
      description:
        When false the value is matched as a substring, which is far slower than an exact match
        on a large record type.
  responses:
    Unauthorized:
      description: Invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTimeout:
      description: The query ran past the server time limit and was cancelled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      description: Error response (4XX)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
