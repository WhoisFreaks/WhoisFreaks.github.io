components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
  parameters:
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
          - json
          - xml
        default: json
    DateParam:
      name: date
      in: query
      schema:
        type: string
        format: date
      description: yyyy-MM-dd; omit for latest
      example: "2026-10-01"
  responses:
    Unauthorized:
      description: Invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      description: Error response (4XX)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegistrarInformation:
      type: object
      properties:
        id:
          type: string
        id_type:
          type: string
        iana_id:
          type: string
        registry_id:
          type: string
        handle:
          type: string
        status:
          type: string
        registrar_name:
          type: string
        normalized_name:
          type: string
        whois_server:
          type: string
        rdap_server:
          type: string
        website_url:
          type: string
        email_address:
          type: string
        phone_number:
          type: string
        authoritative_registry_name:
          type: string
        organization_number:
          type: string
        is_sponsor:
          type: boolean
      additionalProperties: true
      description: Registrar details (used by domain_registrar, abuse_contact).
    ResellerContact:
      type: object
      properties:
        name:
          type: string
        email_address:
          type: string
        phone:
          type: string
      additionalProperties: true
    PersonalInformation:
      type: object
      properties:
        id:
          type: string
        id_type:
          type: string
        handle:
          type: string
        name:
          type: string
        company:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country_name:
          type: string
        country_code:
          type: string
        email_address:
          type: string
        phone:
          type: string
        fax:
          type: string
        mailing_address:
          type: string
      additionalProperties: true
      description: Contact block (registrant/administrative/technical/billing).
    EligibilityInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
      additionalProperties: true
    RegistryData:
      type: object
      properties:
        domain_name:
          type: string
        query_time:
          type: string
        whois_server:
          type: string
        domain_registered:
          type: string
        create_date:
          type: string
        update_date:
          type: string
        expiry_date:
          type: string
        domain_registrar:
          $ref: "#/components/schemas/RegistrarInformation"
        name_servers:
          type: array
          items:
            type: string
        domain_status:
          type: array
          items:
            type: string
        whois_raw_registery:
          type: string
          description: Raw registry WHOIS text (field name spelled as the API returns it)
      additionalProperties: true
    WhoisResponse:
      type: object
      properties:
        status:
          type: boolean
        domain_name:
          type: string
        query_time:
          type: string
        whois_server:
          type: string
        domain_registered:
          type: string
        secure_dns:
          type: boolean
        domain_handle:
          type: string
        create_date:
          type: string
        update_date:
          type: string
        expiry_date:
          type: string
        domain_registrar:
          $ref: "#/components/schemas/RegistrarInformation"
        reseller_contact:
          $ref: "#/components/schemas/ResellerContact"
        registrant_contact:
          $ref: "#/components/schemas/PersonalInformation"
        administrative_contact:
          $ref: "#/components/schemas/PersonalInformation"
        technical_contact:
          $ref: "#/components/schemas/PersonalInformation"
        billing_contact:
          $ref: "#/components/schemas/PersonalInformation"
        eligibility_info:
          $ref: "#/components/schemas/EligibilityInfo"
        abuse_contact:
          $ref: "#/components/schemas/RegistrarInformation"
        name_servers:
          type: array
          items:
            type: string
        domain_status:
          type: array
          items:
            type: string
        whois_raw_domain:
          type: string
        registry_data:
          $ref: "#/components/schemas/RegistryData"
      additionalProperties: true
      description: Live WHOIS lookup response (DomainInfo).
    WhoisHistoricalItem:
      type: object
      properties:
        num:
          type: integer
        status:
          type: boolean
        domain_name:
          type: string
        query_time:
          type: string
        whois_server:
          type: string
        domain_registered:
          type: string
        secure_dns:
          type: boolean
        domain_handle:
          type: string
        create_date:
          type: string
        update_date:
          type: string
        expiry_date:
          type: string
        domain_registrar:
          $ref: "#/components/schemas/RegistrarInformation"
        reseller_contact:
          $ref: "#/components/schemas/ResellerContact"
        registrant_contact:
          $ref: "#/components/schemas/PersonalInformation"
        administrative_contact:
          $ref: "#/components/schemas/PersonalInformation"
        technical_contact:
          $ref: "#/components/schemas/PersonalInformation"
        billing_contact:
          $ref: "#/components/schemas/PersonalInformation"
        eligibility_info:
          $ref: "#/components/schemas/EligibilityInfo"
        abuse_contact:
          $ref: "#/components/schemas/RegistrarInformation"
        name_servers:
          type: array
          items:
            type: string
        domain_status:
          type: array
          items:
            type: string
        whois_raw_domain:
          type: string
        registry_data:
