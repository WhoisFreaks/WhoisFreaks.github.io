  /v2.0/bulkwhois/live:
    post:
      tags:
        - WHOIS
      summary: Bulk WHOIS Lookup
      description: Up to 100 domains in one request. 1 credit per successful domain.
      operationId: bulkWhois
      parameters:
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domainNames
              properties:
                domainNames:
                  type: array
                  items:
                    type: string
                  maxItems: 100
              example:
                domainNames:
                  - whoisfreaks.com
                  - jfreaks.com
            example:
              domainNames:
              - jfreaks.com
              - whoisfreaks.com
