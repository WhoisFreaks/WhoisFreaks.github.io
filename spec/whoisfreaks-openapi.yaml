                - domainName: t-idle.org
                  createDate: '2024-10-24'
                  expiryDate: '2026-10-24'
                  lastSeen: '2026-01-16'
                  isDropped: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v3.0/subdomains/typos:
    get:
      tags:
        - Typosquatting
      summary: Subdomain Typosquatting Lookup
      description: >-
        Find subdomains that carry a typo variant of a brand as one of their
        labels, such as login.paypa1.example.com. Phishing pages often hide the
        brand in the subdomain of an unrelated domain, so these hosts never show
        up in a domain typosquatting search. Pass either keyword or pattern, not
        both. 5 credits per page.
      operationId: subdomainTyposquatting
      parameters:
        - name: keyword
          description: "Brand or label to find typo variants for. 3 to 63 characters, letters, digits and hyphens, a single label with no dots, and it cannot start or end with a hyphen."
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 63
          example: paypal
        - name: pattern
          description: "Wildcard search string, where '*' matches any characters and '?' matches one. At most 2 wildcards, at least 5 characters besides the wildcards, and no more than 63 characters in total."
          in: query
          schema:
            type: string
            minLength: 5
            maxLength: 63
          example: paypa*
        - name: pageToken
          description: "Token from nextPageToken in the previous response, needed from page 2 onward. Send it with the original keyword or pattern."
          in: query
          schema:
            type: string
        - name: fetch_size
          description: "Subdomains per page. 100 when the parameter is left out, and values above 10000 are capped at 10000."
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 100
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquatSubdomainsResponse"
              example:
                status: true
                totalRecords: 98387
                currentPage: 1
                totalPages: 984
                hasNextPage: true
                nextPageToken: eyJkb21haW5OYW1lIjoiMTBya3dzd3BxZi5paGdrZ3BucS5wYXlwYXkuY29wcGVycG9pc29uc2t5LmZpdCIsImN1cnJlbnRQYWdlIjoxLCJ0b3RhbFJlY29yZHMiOjk4Mzg3fQ==
                subdomains:
                - subdomain: 001.paypal.acruefix.com
                  domain: acruefix.com
                  status: inactive
                  firstSeen: '2023-07-11'
                  lastSeen: '2025-10-01'
                  inactiveFrom: '2025-10-01'
                - subdomain: 017067bc272d5376afa25eb4.pypal.mmscloudtest.com
                  domain: mmscloudtest.com
                  status: inactive
                  firstSeen: '2024-08-12'
                  lastSeen: '2025-11-04'
                  inactiveFrom: '2025-11-04'
                - subdomain: 01reportes.paypal.antimoney-laundering.org
                  domain: antimoney-laundering.org
                  status: active
