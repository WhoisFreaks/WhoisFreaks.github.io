  /v2.2/dns/historical:
    get:
      tags:
        - DNS
      summary: Historical DNS Lookup (v2.2)
      description:
        Same records as /v2.0/dns/historical, with two differences. Each entry reports firstSeen
        and lastSeen instead of queryTime, and the results can be sorted. 2 credits per page (100
        records/page).
      operationId: dnsHistoricalV22
      parameters:
        - name: domainName
          description: "Domain to look up."
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: type
          description: "Comma separated DNS record types to return, for example A,MX,TXT. Defaults to all."
          in: query
          schema:
            type: string
            default: all
          required: true
          example: "A,MX,TXT"
        - name: page
          description: "Page of results to return. Defaults to 1."
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDnsResponseV2_2"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.3/dns/historical:
    get:
      tags:
        - DNS
      summary: Historical DNS Lookup (v2.3)
      description:
        Same response as /v2.2/dns/historical. The difference is in error handling. Up to v2.2 a
        query that failed or ran past the server time limit still returned HTTP 200 with
        totalRecords 0, which was indistinguishable from a domain with no history. From v2.3 that
        case returns HTTP 408 instead. 2 credits per page (100 records/page).
      operationId: dnsHistoricalV23
      parameters:
        - name: domainName
          description: "Domain to look up."
          in: query
          schema:
            type: string
          required: true
          example: whoisfreaks.com
        - name: type
          description: "Comma separated DNS record types to return, for example A,MX,TXT. Defaults to all."
          in: query
          schema:
            type: string
            default: all
          required: true
          example: "A,MX,TXT"
        - name: page
          description: "Page of results to return. Defaults to 1."
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDnsResponseV2_2"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.2/dns/reverse:
    get:
      tags:
        - DNS
      summary: Reverse DNS Lookup (v2.2)
      description:
        Same search as /v2.1/dns/reverse. Each entry reports firstSeen and lastSeen instead of
        queryTime, and the results can be sorted. 5 credits per page.
      operationId: dnsReverseV22
      parameters:
        - $ref: "#/components/parameters/ReverseValue"
        - $ref: "#/components/parameters/ReverseType"
        - $ref: "#/components/parameters/ReverseExact"
        - name: page
          description: "Page of results to return. Defaults to 1."
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseDnsResponseV2_2"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.3/dns/reverse:
    get:
      tags:
        - DNS
      summary: Reverse DNS Lookup (v2.3)
      description:
        Same search as /v2.2/dns/reverse, with a bounded total. Counting every match of a broad
        search can take minutes, so from v2.3 the count stops at 10,000 and totalRecordsCapped
        reports whether it did. When totalRecordsCapped is true the real total is higher than
        totalRecords and totalPages is capped with it. Earlier versions still return the exact
        total. A query that runs past the server time limit returns HTTP 408. 5 credits per page.
      operationId: dnsReverseV23
      parameters:
        - $ref: "#/components/parameters/ReverseValue"
        - $ref: "#/components/parameters/ReverseType"
        - $ref: "#/components/parameters/ReverseExact"
        - name: page
          description: "Page of results to return. Defaults to 1."
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseDnsResponseV2_3"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        4XX:
          $ref: "#/components/responses/ErrorResponse"
  /v2.0/dns/bulk/live:
    post:
      tags:
        - DNS
      summary: Bulk DNS Lookup
      description: Up to 100 domains + 100 IPs in one request.
      operationId: dnsBulk
      parameters:
        - name: type
          description: "Comma separated DNS record types to return, for example A,MX,TXT. Defaults to all."
          in: query
          schema:
            type: string
            default: all
          required: true
          example: "A,MX,TXT"
        - $ref: "#/components/parameters/Format"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domainNames:
                  type: array
                  items:
                    type: string
                ipAddresses:
                  type: array
                  items:
                    type: string
            example:
              domainNames:
              - whoisfreaks.com
              - jfreaks.com
              ipAddresses:
              - 1.1.1.1
              - 8.8.8.8
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDnsResponse"
              example:
                bulk_dns_info:
                - status: true
                  queryTime: '2024-08-05 17:38:42'
                  ipAddress: 1.1.1.1
                  dnsTypes:
                    PTR: 12
                  dnsRecords:
                  - name: 1.1.1.1.in-addr.arpa
                    type: 12
                    dnsType: PTR
                    ttl: 1132
                    rawText: "1.1.1.1.in-addr.arpa.\t1132\tIN\tPTR\tone.one.one.one."
                    rRsetType: 12
                    singleName: one.one.one.one.
                - status: true
                  queryTime: '2024-08-05 17:38:42'
                  ipAddress: 8.8.8.8
                  dnsTypes:
                    PTR: 12
                  dnsRecords:
                  - name: 8.8.8.8.in-addr.arpa
                    type: 12
                    dnsType: PTR
                    ttl: 7296
                    rawText: "8.8.8.8.in-addr.arpa.\t7296\tIN\tPTR\tdns.google."
