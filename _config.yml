# GitHub Pages site: https://whoisfreaks.github.io
# The Markdown under docs/ and examples/ is generated by scripts/gen_docs.py and
# carries no front matter, so page titles and descriptions for search results
# are set here with front matter defaults instead.
title: WhoisFreaks Docs
description: >-
  Documentation for the WhoisFreaks WHOIS, reverse WHOIS, WHOIS history, DNS lookup,
  domain availability, IP geolocation and threat intelligence APIs, with official SDKs
  for Python, JavaScript, TypeScript, Java, Kotlin, Go, C#, Ruby, PHP and Swift.
url: https://whoisfreaks.github.io
baseurl: ""
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - scripts/

defaults:
  - scope: { path: "README.md" }
    values:
      title: "WhoisFreaks API and SDK Documentation: WHOIS, DNS and Domain APIs"
  - scope: { path: "docs/endpoints/whois.md" }
    values:
      title: "WHOIS API: Live, History, Reverse and Bulk WHOIS Lookup"
      description: "WHOIS API reference: live WHOIS lookup, WHOIS history back to 1986, reverse WHOIS search by keyword, and bulk WHOIS, with parameters, response fields and SDK examples."
  - scope: { path: "docs/endpoints/dns.md" }
    values:
      title: "DNS Lookup API: Live, Historical, Reverse and Bulk DNS"
      description: "DNS lookup API reference: live DNS records (A, AAAA, MX, NS, CNAME, SOA, TXT, SPF), historical DNS, reverse DNS and bulk DNS lookups, with SDK examples."
  - scope: { path: "docs/endpoints/domain-availability.md" }
    values:
      title: "Domain Availability API: Single, Bulk and TLD Suggestions"
      description: "Domain availability API reference: check if a domain is available, get up to 100 suggestions on other TLDs, and check up to 100 domains in one request."
  - scope: { path: "docs/endpoints/typosquatting.md" }
    values:
      title: "Typosquatting API: Find Lookalike and Typo Domains"
      description: "Typosquatting API reference: find registered domains that look like typo variants of a brand, by keyword or wildcard pattern."
  - scope: { path: "docs/endpoints/ip-whois.md" }
    values:
      title: "IP WHOIS API: IP Address Ownership Lookup"
  - scope: { path: "docs/endpoints/asn-whois.md" }
    values:
      title: "ASN WHOIS API: Autonomous System Lookup"
  - scope: { path: "docs/endpoints/ssl.md" }
    values:
      title: "SSL Certificate API: Live Certificate and Chain Lookup"
  - scope: { path: "docs/endpoints/geolocation.md" }
    values:
      title: "IP Geolocation API: Single and Bulk IP Lookup"
  - scope: { path: "docs/endpoints/ip-reputation.md" }
    values:
      title: "IP Reputation API: IP Threat Intelligence Lookup"
  - scope: { path: "docs/endpoints/domain-reputation.md" }
    values:
      title: "Domain Reputation API: Domain Threat Scoring"
  - scope: { path: "docs/endpoints/subdomains.md" }
    values:
      title: "Subdomains API: Subdomain Enumeration Lookup"
  - scope: { path: "docs/endpoints/databases-threat-feed.md" }
    values:
      title: "Threat Intelligence Feed: Phishing, Malware and Spam Domains"
